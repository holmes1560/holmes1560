<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="280">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>

    <!-- Accent Glow Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Circuit Line Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.5"/>
      <circle cx="40" cy="0" r="1.5" fill="#38BDF8" fill-opacity="0.2"/>
    </pattern>

    <!-- Radial Glow Behind Text -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#070B14" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 900;
      font-size: 42px;
      letter-spacing: 2px;
      fill: url(#accentGrad);
    }
    .callsign-text {
      font-family: 'SF Mono', Monaco, Menlo, Consolas, 'Courier New', monospace;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 4px;
      fill: #38BDF8;
      text-transform: uppercase;
    }
    .desc-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 500;
      font-size: 16px;
      letter-spacing: 1.5px;
      fill: #94A3B8;
    }
    .badge-text {
      font-family: 'SF Mono', Monaco, Menlo, Consolas, monospace;
      font-size: 12px;
      font-weight: 600;
      fill: #E2E8F0;
    }
    .pulse {
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }
  </style>

  <!-- Container Box with Rounded Edges -->
  <rect x="2" y="2" width="896" height="276" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2"/>
  
  <!-- Subtle Grid Overlay -->
  <rect x="2" y="2" width="896" height="276" rx="16" fill="url(#gridPattern)"/>

  <!-- Center Ambient Glow -->
  <ellipse cx="450" cy="140" rx="350" ry="110" fill="url(#centerGlow)"/>

  <!-- Top Decorative Tech Accents -->
  <path d="M 30 25 L 120 25" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  <circle cx="128" cy="25" r="3" fill="#38BDF8"/>
  <path d="M 870 25 L 780 25" stroke="#C084FC" stroke-width="2" stroke-linecap="round"/>
  <circle cx="772" cy="25" r="3" fill="#C084FC"/>

  <!-- Status Chip (Top Right) -->
  <g transform="translate(670, 45)">
    <rect width="180" height="28" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
    <circle cx="16" cy="14" r="4" fill="#10B981" class="pulse"/>
    <text x="28" y="18" class="badge-text" fill="#10B981">ACTIVE • BUILDING</text>
  </g>

  <!-- Location Tag (Top Left) -->
  <g transform="translate(45, 45)">
    <rect width="170" height="28" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
    <text x="16" y="18" class="badge-text" fill="#94A3B8">📍 KUMASI, GHANA</text>
  </g>

  <!-- Main Content Center -->
  <g transform="translate(450, 115)" text-anchor="middle">
    <!-- Callsign / Tag -->
    <text y="-10" class="callsign-text">// SYSTEMS ARCHITECT • @HOLMES1560</text>
    
    <!-- Full Name -->
    <text y="35" class="title-text">ASENSO OWUSU ANSAH</text>
    
    <!-- Subtitle / Tri-Pillar -->
    <text y="70" class="desc-text">FULL-STACK REACT 19 &amp; NODE • EMBEDDED ESP32 IoT • NETWORK FORENSICS</text>
  </g>

  <!-- Bottom Tech Pillars Badges -->
  <g transform="translate(450, 235)" text-anchor="middle">
    <!-- Pillar 1 -->
    <g transform="translate(-250, 0)">
      <rect x="-105" y="-14" width="210" height="28" rx="6" fill="#1E293B" fill-opacity="0.7" stroke="#334155"/>
      <text y="4" class="badge-text" fill="#38BDF8">🛡️ VeriTrust Escrow Engine</text>
    </g>

    <!-- Pillar 2 -->
    <g transform="translate(0, 0)">
      <rect x="-95" y="-14" width="190" height="28" rx="6" fill="#1E293B" fill-opacity="0.7" stroke="#334155"/>
      <text y="4" class="badge-text" fill="#818CF8">📟 ESP32 RFID Firmware</text>
    </g>

    <!-- Pillar 3 -->
    <g transform="translate(245, 0)">
      <rect x="-100" y="-14" width="200" height="28" rx="6" fill="#1E293B" fill-opacity="0.7" stroke="#334155"/>
      <text y="4" class="badge-text" fill="#C084FC">🔍 P-DeepIDS Forensics</text>
    </g>
  </g>

  <!-- Bottom Decorative Accents -->
  <path d="M 30 255 L 120 255" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  <circle cx="128" cy="255" r="3" fill="#38BDF8"/>
  <path d="M 870 255 L 780 255" stroke="#C084FC" stroke-width="2" stroke-linecap="round"/>
  <circle cx="772" cy="255" r="3" fill="#C084FC"/>
</svg>

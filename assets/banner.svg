<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 210" width="100%" height="210">
  <defs>
    <!-- Top hairline highlight -->
    <linearGradient id="topBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#23252a"/>
      <stop offset="25%" stop-color="#5e6ad2" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#828fff" stop-opacity="0.9"/>
      <stop offset="75%" stop-color="#5e6ad2" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#23252a"/>
    </linearGradient>

    <!-- Subtle radial glow -->
    <radialGradient id="linearGlow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#5e6ad2" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#010102" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .eyebrow {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 2px;
      fill: #5e6ad2;
      text-transform: uppercase;
    }
    .headline {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', sans-serif;
      font-size: 34px;
      font-weight: 600;
      letter-spacing: -0.8px;
      fill: #f7f8f8;
    }
    .subhead {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', sans-serif;
      font-size: 15px;
      font-weight: 400;
      line-height: 1.5;
      letter-spacing: -0.2px;
      fill: #8a8f98;
    }
    .pill-bg {
      fill: #0f1011;
      stroke: #23252a;
      stroke-width: 1;
    }
    .pill-text {
      font-family: 'SF Mono', Monaco, Menlo, Consolas, monospace;
      font-size: 11.5px;
      font-weight: 500;
      letter-spacing: 0.2px;
      fill: #d0d6e0;
    }
  </style>

  <!-- Canvas Surface (#010102) with 1px border (#23252a) -->
  <rect x="1" y="1" width="858" height="208" rx="10" fill="#010102" stroke="#23252a" stroke-width="1.5"/>

  <!-- Subtle Ambient Glow -->
  <rect x="2" y="2" width="856" height="206" rx="9" fill="url(#linearGlow)"/>

  <!-- Top Edge Hairline Highlight -->
  <line x1="20" y1="1" x2="840" y2="1" stroke="url(#topBorder)" stroke-width="1.5"/>

  <!-- Eyebrow -->
  <text x="36" y="46" class="eyebrow">ASENSO OWUSU ANSAH // ENGINEER</text>

  <!-- Headline -->
  <text x="36" y="86" class="headline">Building across the seam of software and hardware.</text>

  <!-- Subhead -->
  <text x="36" y="118" class="subhead">Typed transactional backends, financial state machines, ESP32 firmware, and network forensics.</text>

  <!-- Architecture Category Pills -->
  <g transform="translate(36, 148)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="168" height="28" rx="6" class="pill-bg"/>
      <circle cx="14" cy="14" r="3" fill="#5e6ad2"/>
      <text x="26" y="18" class="pill-text">Distributed Systems</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(180, 0)">
      <rect width="182" height="28" rx="6" class="pill-bg"/>
      <circle cx="14" cy="14" r="3" fill="#5e6ad2"/>
      <text x="26" y="18" class="pill-text">Full-Stack TypeScript</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(374, 0)">
      <rect width="170" height="28" rx="6" class="pill-bg"/>
      <circle cx="14" cy="14" r="3" fill="#5e6ad2"/>
      <text x="26" y="18" class="pill-text">Embedded IoT (ESP32)</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(556, 0)">
      <rect width="160" height="28" rx="6" class="pill-bg"/>
      <circle cx="14" cy="14" r="3" fill="#5e6ad2"/>
      <text x="26" y="18" class="pill-text">Network Forensics</text>
    </g>
  </g>
</svg>

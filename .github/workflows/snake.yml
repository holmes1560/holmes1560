name: Generate Snake Contribution Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake animation SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: holmes1560
          outputs: |
            assets/github-snake.svg
            assets/github-snake-dark.svg?palette=github-dark&color_snake=#38BDF8&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Commit and push updated snake SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-snake.svg assets/github-snake-dark.svg
          git commit -m "chore(stats): refresh contribution snake SVGs [skip ci]" || echo "No changes to commit"
          git push origin main
